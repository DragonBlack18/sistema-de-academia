name: Verification toolchain
on:
  push:
    branches: [implementation/consolidacao-web]
    paths: [.github/workflows/toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare frontend packages
        run: |
          mkdir -p toolchain/frontend
          cd toolchain/frontend
          cat > package.json <<'JSON'
          {"name":"sistema-academia-frontend","version":"0.2.0","private":true,"dependencies":{"next":"16.4.3","react":"19.3.1","react-dom":"19.3.1"},"devDependencies":{"@types/node":"^22.0.0","@types/react":"^19.0.0","@types/react-dom":"^19.0.0","eslint":"^9.0.0","eslint-config-next":"16.4.3","typescript":"^5.9.0","vitest":"^3.2.0","@playwright/test":"1.55.0","@axe-core/playwright":"4.10.2"}}
          JSON
          npm install --no-audit --no-fund
          tar -czf ../../frontend-toolchain.tar.gz node_modules package-lock.json
      - name: Prepare Python wheels
        run: |
          mkdir -p toolchain/wheels
          python -m pip download --only-binary=:all: -d toolchain/wheels 'fastapi==0.143.0' 'uvicorn[standard]>=0.35,<1' 'sqlalchemy>=2.0,<2.1' 'psycopg[binary]>=3.2,<4' 'alembic>=1.16,<2' 'pydantic-settings>=2.10,<3' 'PyJWT>=2.10,<3' 'argon2-cffi>=25.1,<26' 'email-validator>=2.2,<3' 'python-multipart>=0.0.20,<1' 'pytest>=8.4,<9' 'httpx>=0.28,<1' 'httpx2>=2,<3'
          tar -czf python-wheels.tar.gz -C toolchain wheels
      - name: Prepare isolated PostgreSQL binaries
        run: |
          mkdir -p toolchain/postgres
          docker run --rm --entrypoint bash -v "$PWD/toolchain/postgres:/out" postgres:18-bookworm -euc '
            mkdir -p /out/bin /out/share /out/lib
            cp -a /usr/lib/postgresql/18/bin/. /out/bin/
            cp -a /usr/share/postgresql/18/. /out/share/
            cp -a /usr/lib/postgresql/18/lib/. /out/lib/
            find /usr/lib/postgresql/18/bin /usr/lib/postgresql/18/lib -type f -print0 | xargs -0 -n 1 ldd 2>/dev/null | awk '\''$3 ~ /^\// {print $3} $1 ~ /^\// {print $1}'\'' | sort -u | while read -r lib; do
              case "$(basename "$lib")" in libc.so.*|ld-linux*|libpthread.so.*|libdl.so.*|librt.so.*|libm.so.*|libresolv.so.*) continue;; esac
              cp -L "$lib" /out/lib/
            done
          '
          tar -czf postgres-toolchain.tar.gz -C toolchain postgres
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-toolchain
          path: frontend-toolchain.tar.gz
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: python-wheels.tar.gz
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-toolchain
          path: postgres-toolchain.tar.gz
          retention-days: 7
          compression-level: 0
