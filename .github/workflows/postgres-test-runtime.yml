name: Prepare PostgreSQL test runtime
on:
  push:
    branches: [implementation/secure-web-consolidation]
    paths: [.github/workflows/postgres-test-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Extract official runtime and verification tools
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:18-trixie
          docker image inspect postgres:18-trixie --format '{{index .RepoDigests 0}}' > image-digest.txt
          mkdir -p pg-runtime/usr/lib/postgresql pg-runtime/usr/share/postgresql pg-runtime/usr/lib/x86_64-linux-gnu tools
          id=$(docker create postgres:18-trixie)
          trap 'docker rm -v "$id" >/dev/null' EXIT
          docker cp "$id:/usr/lib/postgresql/18" pg-runtime/usr/lib/postgresql/18
          docker cp "$id:/usr/share/postgresql/18" pg-runtime/usr/share/postgresql/18
          docker cp -L "$id:/usr/lib/x86_64-linux-gnu/liburing.so.2" pg-runtime/usr/lib/x86_64-linux-gnu/liburing.so.2
          docker run --rm --entrypoint bash postgres:18-trixie -c 'postgres --version; ldd /usr/lib/postgresql/18/bin/postgres' > runtime-versions.txt
          cd tools
          printf '%s\n' '{"private":true,"name":"vitality-test-tools","version":"0.0.0"}' > package.json
          npm install --save-exact @playwright/test@1.55.0 prettier@3.6.2
          python -m pip download --only-binary=:all: --dest wheels black==25.9.0
          cd ..
          tar -czf pg-runtime.tar.gz pg-runtime image-digest.txt runtime-versions.txt tools
          sha256sum pg-runtime.tar.gz > pg-runtime.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vitality-postgres18-runtime
          path: |
            pg-runtime.tar.gz
            pg-runtime.sha256
          retention-days: 2
          if-no-files-found: error
